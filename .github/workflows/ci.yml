name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Fumadocs source
        run: npx fumadocs-mdx

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate experiments
        run: npm run validate:experiments

      - name: Unit tests
        run: npm run test -- --run --project unit

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
            nextjs-

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run budget

      - name: Analyze bundles
        run: npm run analyze:output

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: bundle-analysis-${{ github.sha }}
          path: .next/diagnostics/analyze/
