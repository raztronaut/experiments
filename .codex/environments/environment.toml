# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "experiments-codex"

[setup]
script = '''
set -euo pipefail

# Fresh worktree: avoid inheriting partial Next caches/locks
rm -rf .next

# Install deps if missing (optional, but convenient)
if [ ! -d node_modules ]; then
  npm ci
fi
'''

[[actions]]
name = "stale lock fix"
icon = "tool"
command = '''
set -euo pipefail

# If lock exists but no process holds it, remove it
if [ -f .next/lock ] && command -v lsof >/dev/null 2>&1; then
  if ! lsof .next/lock >/dev/null 2>&1; then
    rm -f .next/lock
  fi
fi

npm run build
'''
